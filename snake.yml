name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # roda a cada 12h
  workflow_dispatch: # permite rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: matheus-crisostomo
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=ef4444&color_dots=#1a1b27,#2d1a1a,#5c2020,#b91c1c,#ef4444

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
