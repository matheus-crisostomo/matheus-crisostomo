name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: matheus-crisostomo
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=ef4444&color_dots=#1a1b27,#2d1a1a,#5c2020,#b91c1c,#ef4444
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output
          git rm -rf .
          cp dist/github-snake-dark.svg .
          git add github-snake-dark.svg
          git commit -m "chore: update snake svg"
          git push origin output --force
